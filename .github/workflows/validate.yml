name: Validate OSRS Hub Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Regression tests and isolated production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out test repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run all regression tests
        run: npm test
      - name: Build the Worker Assets site
        run: npm run build
      - name: Verify deployable output
        run: |
          test -s site/index.html
          test -s site/_osrshub_build.txt
          test -d site/assets
          echo "OSRS Hub Test build output verified."
      - name: Package test build
        run: |
          mkdir -p release
          zip -r release/osrshub-test-source.zip . -x '.git/*' 'node_modules/*' 'site/*' 'release/*'
          zip -r release/osrshub-test-site.zip site
          printf 'OSRS Hub Test 2.0.0-test.1\nCommit: %s\nValidation: npm test + npm run build passed\n' "$GITHUB_SHA" > release/BUILD-INFO.txt
      - name: Upload isolated test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osrshub-test-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
