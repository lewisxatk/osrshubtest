name: Deploy OSRS Hub Test (isolated)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: osrshubtest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy the test website only
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 58cc0c5ee11304ba28f879f354bd899c
    steps:
      - name: Check out test repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build isolated test website
        run: npm run build
      - name: Deploy isolated OSRS Hub Test Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify test website responds
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 https://osrshubtest.prices-app.workers.dev/ -o /dev/null
