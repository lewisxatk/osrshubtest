name: Deploy OSRS Hub Test (isolated)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: osrshubtest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy the test website only
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 58cc0c5ee11304ba28f879f354bd899c
    steps:
      - name: Check out test repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build isolated test website
        run: npm run build
      - name: Deploy isolated OSRS Hub Test Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check out combat engine runtime
        uses: actions/checkout@v4
        with:
          repository: lewisxatk/osrshub-combat-engine
          ref: main
          path: combat-engine
      - name: Enable Corepack for combat engine
        run: corepack enable
      - name: Set up Node.js for combat engine
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: combat-engine/yarn.lock
      - name: Install combat engine dependencies
        working-directory: combat-engine
        run: yarn install --immutable
      - name: Run combat engine tests
        working-directory: combat-engine
        run: yarn test
      - name: Deploy isolated test combat runtime
        working-directory: combat-engine
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 58cc0c5ee11304ba28f879f354bd899c
      - name: Verify test combat runtime health, catalogue data and browser CORS
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://osrshubtest.prices-app.workers.dev"
          BASE="https://osrshubtest-combat-runtime.prices-app.workers.dev"
          verify_get() {
            local endpoint="$1"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 8 --retry-delay 5 -D "$headers" -o "$body" -w '%{http_code}' -H "Origin: $ORIGIN" -H 'Accept: application/json' "$BASE$endpoint")"
            test "$status" = "200"
            grep -Eiq "^access-control-allow-origin:[[:space:]]*$ORIGIN" "$headers"
            if [[ "$endpoint" != "/health" ]]; then
              node - "$body" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.status !== 'ok' || !Number.isInteger(payload.total) || payload.total <= 0 || !Array.isArray(payload.results) || payload.results.length === 0) {
            throw new Error('Canonical combat catalogue returned an empty or invalid payload');
          }
          for (const row of payload.results) {
            if (!Number.isInteger(Number(row.id)) || !String(row.name || '').trim()) {
              throw new Error('Canonical catalogue contains an item without a stable ID or name');
            }
          }
          NODE
            fi
            rm -f "$headers" "$body"
          }
          verify_get /health
          verify_get '/api/monsters?limit=2'
          verify_get '/api/equipment?limit=2'
          # Exercise the real canonical calculation path, not just Worker health/catalogue.
          node <<'NODE'
          const BASE = 'https://osrshubtest-combat-runtime.prices-app.workers.dev';
          const ORIGIN = 'https://osrshubtest.prices-app.workers.dev';
          const slots = ['head','cape','neck','ammo','weapon','body','shield','legs','hands','feet','ring'];
          const skills = { atk:99, def:99, hp:99, magic:99, prayer:99, ranged:99, str:99, mining:99, herblore:99, farming:99 };
          const boosts = Object.fromEntries(Object.keys(skills).map((key) => [key, 0]));
          const buffs = {
            potions: [], onSlayerTask: false, inWilderness: false, forinthrySurge: false,
            soulreaperStacks: 0, baAttackerLevel: 0, chinchompaDistance: 0,
            kandarinDiary: false, chargeSpell: false, markOfDarknessSpell: false,
            usingSunfireRunes: false, fragmentOfWind: false, fragmentOfWater: false,
            fragmentOfEarth: false, fragmentOfFire: false,
          };
          async function get(path) {
            const response = await fetch(BASE + path, { headers: { Origin: ORIGIN, Accept: 'application/json' } });
            if (!response.ok) throw new Error(`GET ${path} failed: HTTP ${response.status}`);
            const payload = await response.json();
            if (payload.status !== 'ok' || !Array.isArray(payload.results)) throw new Error(`GET ${path} returned an invalid catalogue`);
            return payload.results;
          }
          async function main() {
            const [monsters, weapons] = await Promise.all([
              get('/api/monsters?offset=0&limit=1000'),
              get('/api/equipment?slot=weapon&offset=0&limit=1000'),
            ]);
            const monster = monsters.find((row) => Number(row?.skills?.hp) > 0);
            const weapon = weapons.find((row) => Number(row?.offensive?.ranged) > 0)
              || weapons.find((row) => Number(row?.offensive?.stab) > 0 || Number(row?.offensive?.slash) > 0 || Number(row?.offensive?.crush) > 0)
              || weapons[0];
            if (!monster || !weapon) throw new Error('No usable canonical monster/weapon found for calculation smoke test');
            const isRanged = Number(weapon.offensive?.ranged) > 0;
            const isMagic = !isRanged && Number(weapon.offensive?.magic) > 0;
            const stance = isRanged ? 'Rapid' : isMagic ? 'Autocast' : 'Aggressive';
            const style = { name: stance, type: isRanged ? 'ranged' : isMagic ? 'magic' : 'slash', stance };
            const equipment = Object.fromEntries(slots.map((slot) => [slot, null]));
            equipment.weapon = { id: weapon.id };
            const request = {
              player: {
                name: 'OSRS Hub deployment smoke test', style, skills, boosts,
                equipment, prayers: [], buffs, spell: null,
              },
              monsterId: monster.id, monsterIndex: monster.recordIndex,
              monsterName: monster.name, monsterVersion: monster.version ?? '',
            };
            const response = await fetch(BASE + '/api/calculate', {
              method: 'POST',
              headers: { Origin: ORIGIN, Accept: 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify(request),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.status !== 'calculated') {
              throw new Error(`Real combat calculation smoke test failed (HTTP ${response.status}): ${(payload?.issues || [payload?.error || 'invalid response']).join('; ')}`);
            }
            const values = ['dps','maxHit','accuracy','attackRoll','npcDefenceRoll','attackSpeed'];
            if (!payload.result || values.some((key) => !Number.isFinite(payload.result[key]))) {
              throw new Error('Real combat calculation returned missing/non-finite result fields');
            }
            console.log(`Combat calculation verified: ${weapon.name} vs ${monster.name}, DPS ${payload.result.dps}`);
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
          PREFLIGHT_HEADERS="$(mktemp)"
          PREFLIGHT_STATUS="$(curl --silent --show-error -X OPTIONS -D "$PREFLIGHT_HEADERS" -o /dev/null -w '%{http_code}' -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: accept' "$BASE/api/monsters")"
          test "$PREFLIGHT_STATUS" = "204"
          grep -Eiq "^access-control-allow-origin:[[:space:]]*$ORIGIN" "$PREFLIGHT_HEADERS"
          grep -Eiq '^access-control-allow-headers:.*accept' "$PREFLIGHT_HEADERS"
          rm -f "$PREFLIGHT_HEADERS"
      - name: Verify test website responds
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 https://osrshubtest.prices-app.workers.dev/ -o /dev/null
