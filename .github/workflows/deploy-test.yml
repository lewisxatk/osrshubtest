name: Deploy OSRS Hub Test (isolated)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: osrshubtest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy the test website only
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 58cc0c5ee11304ba28f879f354bd899c
    steps:
      - name: Check out test repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build isolated test website
        run: npm run build
      - name: Deploy isolated OSRS Hub Test Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check out combat engine runtime
        uses: actions/checkout@v4
        with:
          repository: lewisxatk/osrshub-combat-engine
          ref: main
          path: combat-engine
      - name: Enable Corepack for combat engine
        run: corepack enable
      - name: Set up Node.js for combat engine
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: combat-engine/yarn.lock
      - name: Install combat engine dependencies
        working-directory: combat-engine
        run: yarn install --immutable
      - name: Run combat engine tests
        working-directory: combat-engine
        run: yarn test
      - name: Deploy isolated test combat runtime
        working-directory: combat-engine
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 58cc0c5ee11304ba28f879f354bd899c
      - name: Verify test combat runtime health and catalogues
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://osrshubtest-combat-runtime.prices-app.workers.dev/health
          curl --fail --silent --show-error https://osrshubtest-combat-runtime.prices-app.workers.dev/api/monsters?limit=1
          curl --fail --silent --show-error https://osrshubtest-combat-runtime.prices-app.workers.dev/api/equipment?limit=1
      - name: Verify test website responds
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 https://osrshubtest.prices-app.workers.dev/ -o /dev/null
